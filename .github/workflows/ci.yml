name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: pip install -r server/requirements-ci.txt
      - run: npm run check
      - name: Validate production security configuration
        env:
          MALWARE_SCAN_MODE: required
          DEFAULT_RETENTION_DAYS: '90'
          MAX_UPLOAD_BYTES: '104857600'
          CORS_ORIGINS: https://video.example.com
          APP_PUBLIC_URL: https://video.example.com
          VIDEO_WORKER_TOKEN: ci-only-token-0123456789abcdef0123456789
          DATABASE_URL: postgresql://ci-placeholder
          REDIS_URL: redis://ci-placeholder
          OBJECT_STORAGE_PROVIDER: supabase
          OBJECT_STORAGE_BUCKET: ci-private-bucket
          OBJECT_STORAGE_ENDPOINT: https://example.supabase.co/storage/v1
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          OIDC_ISSUER_URL: https://example.supabase.co/auth/v1
          OIDC_AUDIENCE: authenticated
          AUTH_MODE: required
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
        run: |
          npm run validate:production
          docker compose -f compose.production.yml config --quiet
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
